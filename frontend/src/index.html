<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>Clinique Badri — Chirurgie plastique, esthétique & reconstructrice</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Cabinet de chirurgie plastique, esthétique et reconstructrice. Prise de rendez-vous en ligne, suivi personnalisé et messagerie sécurisée avec le docteur.">
  <meta name="theme-color" content="#faf7f2" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#121010" media="(prefers-color-scheme: dark)">
  <!-- App icons: generated by scripts/generate-icons.mjs -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="icon" sizes="48x48" href="favicon.ico">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="apple-mobile-web-app-title" content="Clinique Badri">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script>
    // Apply the theme before first paint to avoid a flash.
    (function () {
      try {
        var t = localStorage.getItem('theme');
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>

# Render Blueprint: https://render.com/docs/blueprint-spec
# Render > New > Blueprint > select this repository. You will be prompted for "sync: false" values.
services:
  - type: web
    name: clinique-badri-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    region: frankfurt
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: DOCTOR_NOTIFICATION_EMAIL
        sync: false
      - key: FRONTEND_URL
        sync: false # e.g. https://clinique-badri.pages.dev
      - key: ALLOWED_ORIGINS
        sync: false # e.g. https://clinique-badri.pages.dev,https://*.clinique-badri.pages.dev
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: DOCTOR_EMAIL
        sync: false
      - key: DOCTOR_PASSWORD
        sync: false
      - key: DOCTOR_FIRST_NAME
        value: Camille
      - key: DOCTOR_LAST_NAME
        value: Badri
      - key: CLINIC_TIME_ZONE
        value: Europe/Paris
      - key: SEED_DEMO_DATA
        value: "false"

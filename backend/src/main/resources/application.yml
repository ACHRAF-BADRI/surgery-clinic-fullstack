server:
  port: ${PORT:8080}
  forward-headers-strategy: framework

spring:
  application:
    name: clinic-api
  web:
    error:
      include-message: always
  # Locally, variables are read from backend/.env (absent in production: Render injects them).
  config:
    import: optional:file:.env[.properties]
  mongodb:
    uri: ${MONGODB_URI:mongodb://localhost:27017/clinic}
  data:
    mongodb:
      auto-index-creation: true
  jackson:
    default-property-inclusion: non_null

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

app:
  clinic-name: ${CLINIC_NAME:Clinique Éclat}
  frontend-url: ${FRONTEND_URL:http://localhost:4200}
  allowed-origins: ${ALLOWED_ORIGINS:http://localhost:4200}
  time-zone: ${CLINIC_TIME_ZONE:Europe/Paris}
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-change-me-dev-only-secret-change-me-0123456789}
    expiration-hours: ${JWT_EXPIRATION_HOURS:72}
  mail:
    resend-api-key: ${RESEND_API_KEY:}
    from: ${MAIL_FROM:Clinique Éclat <onboarding@resend.dev>}
    doctor-notification-email: ${DOCTOR_NOTIFICATION_EMAIL:}
  seed:
    admin-email: ${ADMIN_EMAIL:admin@clinique-eclat.fr}
    admin-password: ${ADMIN_PASSWORD:Admin#2026}
    doctor-email: ${DOCTOR_EMAIL:docteur@clinique-eclat.fr}
    doctor-password: ${DOCTOR_PASSWORD:Docteur#2026}
    doctor-first-name: ${DOCTOR_FIRST_NAME:Camille}
    doctor-last-name: ${DOCTOR_LAST_NAME:Laurent}
    demo-data: ${SEED_DEMO_DATA:false}
  schedule:
    slot-minutes: 30
    min-notice-hours: 2
    patient-cancel-notice-hours: 24
    # day: start-end (empty = closed)
    hours:
      MONDAY: "09:00-18:00"
      TUESDAY: "09:00-18:00"
      WEDNESDAY: "09:00-18:00"
      THURSDAY: "09:00-19:00"
      FRIDAY: "09:00-17:00"
      SATURDAY: "09:00-13:00"
      SUNDAY: ""
